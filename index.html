<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <header class="header">
                <h1>Jazz Generator</h1>
            </header>

            <div class="tabs">
                <button class="tab active" data-tab="style">Style</button>
                <button class="tab" data-tab="mix">Mix</button>
                <button class="tab" data-tab="effects">Effects</button>
            </div>

            <div class="tab-content">
                <div class="tab-panel active" id="style-panel">
                    <div class="presets">
                        <button class="preset" data-preset="bebop">Bebop</button>
                        <button class="preset" data-preset="cool">Cool Jazz</button>
                        <button class="preset" data-preset="modal">Modal</button>
                        <button class="preset" data-preset="swing">Swing</button>
                        <button class="preset" data-preset="latin">Latin</button>
                        <button class="preset" data-preset="ballad">Ballad</button>
                    </div>

                    <div class="controls">
                        <div class="control">
                            <label>Key</label>
                            <select id="root-note">
                                <option value="C">C</option>
                                <option value="Db">Db</option>
                                <option value="D">D</option>
                                <option value="Eb">Eb</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="Gb">Gb</option>
                                <option value="G">G</option>
                                <option value="Ab">Ab</option>
                                <option value="A">A</option>
                                <option value="Bb">Bb</option>
                                <option value="B">B</option>
                            </select>
                        </div>

                        <div class="control">
                            <label>
                                <span>Tempo</span>
                                <span class="value" id="tempo-value">120</span>
                            </label>
                            <input type="range" id="tempo" min="60" max="240" value="120" step="1">
                        </div>

                        <div class="control">
                            <label>
                                <span>Complexity</span>
                                <span class="value" id="complexity-value">50</span>
                            </label>
                            <input type="range" id="complexity" min="0" max="100" value="50">
                        </div>

                        <div class="control">
                            <label>
                                <span>Swing</span>
                                <span class="value" id="swing-value">67</span>
                            </label>
                            <input type="range" id="swing" min="50" max="75" value="67">
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="mix-panel">
                    <div class="controls">
                        <div class="control">
                            <label>
                                <span>Piano</span>
                                <span class="value" id="piano-vol-value">70</span>
                            </label>
                            <input type="range" id="piano-vol" min="0" max="100" value="70">
                        </div>

                        <div class="control">
                            <label>
                                <span>Bass</span>
                                <span class="value" id="bass-vol-value">75</span>
                            </label>
                            <input type="range" id="bass-vol" min="0" max="100" value="75">
                        </div>

                        <div class="control">
                            <label>
                                <span>Drums</span>
                                <span class="value" id="drums-vol-value">60</span>
                            </label>
                            <input type="range" id="drums-vol" min="0" max="100" value="60">
                        </div>

                        <div class="control">
                            <label>
                                <span>Density</span>
                                <span class="value" id="density-value">50</span>
                            </label>
                            <input type="range" id="density" min="0" max="100" value="50">
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="effects-panel">
                    <div class="controls">
                        <div class="control">
                            <label>
                                <span>Reverb</span>
                                <span class="value" id="reverb-value">40</span>
                            </label>
                            <input type="range" id="reverb" min="0" max="100" value="40">
                        </div>

                        <div class="control">
                            <label>
                                <span>Delay</span>
                                <span class="value" id="delay-value">15</span>
                            </label>
                            <input type="range" id="delay" min="0" max="100" value="15">
                        </div>

                        <div class="control">
                            <label>
                                <span>Tone</span>
                                <span class="value" id="tone-value">65</span>
                            </label>
                            <input type="range" id="tone" min="0" max="100" value="65">
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="transport">
                <button id="play-btn" class="play-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button id="stop-btn" class="stop-button" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12"/>
                    </svg>
                </button>

                <div class="chord-display">
                    <div class="chord-label">Current Chord</div>
                    <div class="chord-name" id="current-chord">—</div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
